[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-evacuation-planner"
version = "0.1.0"
description = "Accurate AI-based flood evacuation route planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "osmnx>=2.1.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "folium>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
